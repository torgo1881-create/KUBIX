  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ckground:#14302F\"><\u002Fspan><span style=\"width:7px;height:7px;border-radius:2px;background:#F6D5BF\"><\u002Fspan><span style=\"width:7px;height:7px;border-radius:2px;background:#C8471F\"><\u002Fspan><span style=\"width:7px;height:7px;border-radius:2px;background:#F6D5BF\"><\u002Fspan><span style=\"width:7px;height:7px;border-radius:2px;background:#C8471F\"><\u002Fspan><span style=\"width:7px;height:7px;border-radius:2px;background:#14302F\"><\u002Fspan><\u002Fspan>\n        <span style=\"font-family:'Montserrat Alternates',sans-serif;font-weight:800;font-size:22px\">kubix<\u002Fspan>\n      <\u002Fbutton>\n      <nav style=\"display:flex;gap:22px;flex-wrap:wrap;align-items:center;font-weight:700;font-size:15px\">\n        <sc-if value=\"{{ isLanding }}\" hint-placeholder-val=\"{{ true }}\"><a href=\"#catalog\" style=\"color:#14302F\">Каталог<\u002Fa><a href=\"#how\" style=\"color:#14302F\">Как это работает<\u002Fa><a href=\"#gift\" style=\"color:#14302F\">В подарок<\u002Fa><a href=\"#faq\" style=\"color:#14302F\">Вопросы<\u002Fa><\u002Fsc-if>\n      <\u002Fnav>\n      <div style=\"margin-left:auto;display:flex;gap:10px;align-items:center\">\n        <button sc-camel-on-click=\"{{ goUpload }}\" style=\"background:transparent;border:2px solid #14302F;color:#14302F;border-radius:12px;padding:9px 16px;font:inherit;font-weight:800;cursor:pointer\" style-hover=\"background:#14302F;color:#F6F1EA\">Загрузить фото<\u002Fbutton>\n        <span style=\"display:flex;align-items:center;gap:8px;background:#FFFFFF;border:1px solid #E2D9CC;border-radius:12px;padding:9px 14px;font-weight:800\">Корзина <span style=\"min-width:22px;height:22px;border-radius:11px;background:{{ cartBg }};color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:12px\">{{ cartCount }}<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <sc-if value=\"{{ isLanding }}\" hint-placeholder-val=\"{{ true }}\">\n    <section style=\"max-width:1240px;margin:0 auto;padding:48px 24px 72px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:48px;align-items:center\">\n      <div style=\"display:flex;flex-direction:column;gap:24px\">\n        <span style=\"align-self:flex-start;background:#D3E8E0;color:#14302F;border-radius:999px;padding:6px 14px;font-weight:800;font-size:13px\">Фото-конструктор<\u002Fspan>\n        <h1 style=\"margin:0;font-family:'Montserrat Alternates',sans-serif;font-weight:800;font-size:clamp(40px,5.8vw,78px);line-height:1;letter-spacing:-.03em;text-wrap:balance\">Собери любое фото <span style=\"color:#C8471F\">из деталей<\u002Fspan><\u002Fh1>\n        <p style=\"margin:0;max-width:500px;font-size:19px;color:#4F6563;text-wrap:pretty\">Один набор — и любая фотография становится картиной для стены. Загрузи снимок, получи схему и собирай.<\u002Fp>\n        <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n          <a href=\"#catalog\" style=\"background:#C8471F;color:#FFFFFF;border-radius:14px;padding:16px 28px;font-size:17px;font-weight:800\">Выбрать набор<\u002Fa>\n          <button sc-camel-on-click=\"{{ goUpload }}\" style=\"background:#FFFFFF;border:0;border-radius:14px;padding:16px 24px;font:inherit;font-size:17px;font-weight:800;color:#14302F;cursor:pointer;box-shadow:inset 0 0 0 1px #E2D9CC\">Попробовать бесплатно<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position:relative;padding:0 0 60px 40px;display:flex;justify-content:center\">\n        <div style=\"width:min(100%,380px);background:#14302F;border-radius:24px;padding:16px;transform:rotate(1.5deg)\">\n          <sc-if value=\"{{ ready }}\"><div role=\"img\" aria-label=\"Мозаика\" style=\"width:100%;aspect-ratio:2/3;border-radius:8px;background-image:url({{ heroColor }});background-size:100% 100%\"><\u002Fdiv><\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"position:absolute;left:0;bottom:0;width:min(62%,280px);aspect-ratio:16/10;border-radius:18px;background:repeating-linear-gradient(135deg,#F6D5BF 0 10px,#F2C9A8 10px 20px);border:4px solid #F6F1EA;display:flex;align-items:flex-end;padding:14px;box-shadow:0 20px 40px -20px rgba(20,48,47,.5)\">\n          <span style=\"background:#14302F;color:#F6F1EA;border-radius:8px;padding:4px 8px;font-family:monospace;font-size:12px\">видео: как собирается картина<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"catalog\" style=\"background:#FFFFFF;border-top:1px solid #E2D9CC;border-bottom:1px solid #E2D9CC\">\n      <div style=\"max-width:1240px;margin:0 auto;padding:80px 24px;display:flex;flex-direction:column;gap:32px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap\">\n          <h2 style=\"margin:0;font-family:'Montserrat Alternates',sans-serif;font-weight:800;font-size:clamp(30px,3.8vw,48px);letter-spacing:-.02em;line-height:1.05\">Какой формат выбрать?<\u002Fh2>\n          <span style=\"color:#4F6563;max-width:380px\">Превью — это твоё фото в палитре каждого набора. Загрузи своё, и картинки обновятся.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:16px\">\n          <sc-for list=\"{{ shop }}\" as=\"q\" hint-placeholder-count=\"5\">\n            <article style=\"background:#F6F1EA;border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:12px\">\n              <div style=\"background:#14302F;border-radius:14px;padding:10px;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center\"><sc-if value=\"{{ ready }}\"><div role=\"img\" aria-label=\"Превью набора\" style=\"width:100%;max-height:100%;aspect-ratio:{{ q.aspect }};border-radius:4px;background-image:url({{ q.preview }});background-size:100% 100%\"><\u002Fdiv><\u002Fsc-if><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;align-items:baseline;padding:0 4px\"><span style=\"font-family:'Montserrat Alternates',sans-serif;font-weight:800;font-size:20px\">{{ q.name }}<\u002Fspan><span style=\"font-size:13px;color:#4F6563\">{{ q.cat }}<\u002Fspan><\u002Fdiv>\n              <dl style=\"margin:0;padding:0 4px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px\"><dt style=\"color:#4F6563\">Картина<\u002Fdt><dd style=\"margin:0;font-weight:800\">{{ q.size }}<\u002Fdd><dt style=\"color:#4F6563\">Деталей<\u002Fdt><dd style=\"margin:0;font-weight:800\">{{ q.pieces }}<\u002Fdd><dt style=\"color:#4F6563\">Цвета<\u002Fdt><dd style=\"margin:0;display:flex;gap:2px;align-items:center\"><sc-for list=\"{{ q.swatches }}\" as=\"c\"><span style=\"width:12px;height:12px;border-radius:3px;background:{{ c.hex }};box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)\"><\u002Fspan><\u002Fsc-for><\u002Fdd><\u002Fdl>\n              <div style=\"display:flex;flex-direction:column;gap:6px;margin-top:auto;padding:4px 4px 2px\">\n                <button sc-camel-on-click=\"{{ q.onBuy }}\" style=\"width:100%;height:42px;background:#C8471F;color:#FFFFFF;border:0;border-radius:10px;font:inherit;font-size:15px;font-weight:700;cursor:pointer\" style-hover=\"background:#A93A17\">В корзину<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ q.onStart }}\" title=\"Примерить своё фото\" style=\"width:100%;height:42px;background:#FFFFFF;border:1.5px solid #14302F;border-radius:10px;font:inherit;font-size:15px;font-weight:700;color:#14302F;cursor:pointer\" style-hover=\"background:#14302F;color:#FFFFFF\">Примерить<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Farticle>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"how\" style=\"max-width:1240px;margin:0 auto;padding:80px 24px;display:flex;flex-direction:column;gap:32px\">\n      <h2 style=\"margin:0;font-family:'Montserrat Alternates',sans-serif;font-weight:800;font-size:clamp(30px,3.8vw,48px);letter-spacing:-.02em;line-height:1.05\">Как это работает<\u002Fh2>\n      <ol style=\"list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px\">\n        <li style=\"background:#FFFFFF;border-radius:22px;padding:26px;display:flex;flex-direction:column;gap:12px\"><span style=\"font-family:'Montserrat Alternates',sans-serif;font-weight:800;font-size:48px;line-height:1;color:#C8471F\">1<\u002Fspan><strong style=\"font-size:20px;font-weight:800\">Выбери набор<\u002Fstrong><span style=\"color:#4F6563\">Classic в оттенках серого или Color с тёплыми тонами. От 51×51 до 76×76 см.<\u002Fspan><\u002Fli>\n        <li style=\"background:#FFFFFF;border-radius:22px;padding:26px;display:flex;flex-direction:column;gap:12px\"><span style=\"font-family:'Montserrat Alternates',sans-serif;font-weight:800;font-size:48px;line-height:1;color:#C8471F\">2<\u002Fspan><strong style=\"font-size:20px;font-weight:800\">Загрузи фото в генератор<\u002Fstrong><span style=\"color:#4F6563\">Код для сборки лежит в коробке. А примерить можно бесплатно, ещё до покупки.<\u002Fspan><\u002Fli>\n        <li style=\"background:#14302F;color:#F6F1EA;border-radius:22px;padding:26px;display:flex;flex-direction:column;gap:12px\"><span style=\"font-family:'Montserrat Alternates',sans-serif;font-weight:800;font-size:48px;line-height:1;color:#F6D5BF\">3<\u002Fspan><strong style=\"font-size:20px;font-weight:800\">Получи инструкцию<\u002Fstrong><span style=\"color:#C9D6D3\">Схема по блокам с номерами цветов, на экране или в PDF. Надоело фото — пересобери с новым.<\u002Fspan><\u002Fli>\n      <\u002Fol>\n    <\u002Fsection>\n\n    <section style=\"background:#14302F;color:#F6F1EA\">\n      <div style=\"max-width:1240px;margin:0 auto;padding:80px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:48px;align-items:center\">\n        <div style=\"display:flex;flex-direction:column;gap:20px\">\n          <h2 style=\"margin:0;font-family:'Montserrat Alternates',sans-serif;font-weight:800;font-size:clamp(30px,3.8vw,48px);letter-spacing:-.02em;line-height:1.05\">Посмотри, как будет выглядеть твоя картина<\u002Fh2>\n          <p style=\"margin:0;color:#C9D6D3;font-size:17px\">Двигай ползунок: слева фото, справа оно же в деталях Color M. Загрузи своё — всё считается прямо в браузере.<\u002Fp>\n          <label sc-camel-on-drag-over=\"{{ onDragOver }}\" sc-camel-on-drag-leave=\"{{ onDragLeave }}\" sc-camel-on-drop=\"{{ onDrop }}\" style=\"border:2px dashed #4F7A76;border-radius:18px;padding:22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;cursor:pointer\">\n            <input type=\"file\" accept=\"image/jpeg,image/png,image/webp\" sc-camel-on-change=\"{{ onLandFile }}\" style=\"display:none\">\n            <span style=\"background:#C8471F;color:#FFFFFF;border-radius:12px;padding:12px 20px;font-weight:800\">Загрузить файл<\u002Fspan>\n            <span style=\"color:#C9D6D3;font-size:14px\">или перетащи фото сюда · {{ photoName }}<\u002Fspan>\n          <\u002Flabel>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:14px;align-items:center\">\n          <div style=\"position:relative;width:min(100%,380px);aspect-ratio:2/3;border-radius:16px;overflow:hidden;background:#0E2322\">\n            <sc-if value=\"{{ ready }}\"><div style=\"position:absolute;inset:0;background-image:url({{ heroColor }});background-size:100% 100%\"><\u002Fdiv><div style=\"position:absolute;inset:0;background-image:url({{ heroPhoto }});background-size:100% 100%;clip-path:inset(0 {{ cmpClip }} 0 0)\"><\u002Fdiv><\u002Fsc-if>\n            <div style=\"position:absolute;top:0;bottom:0;left:{{ cmpPos }};width:3px;margin-left:-1.5px;background:#F6F1EA;pointer-events:none\"><\u002Fdiv>\n            <span style=\"position:absolute;left:10px;top:10px;background:rgba(20,48,47,.85);color:#F6F1EA;border-radius:8px;padding:3px 8px;font-size:12px;font-weight:800\">фото<\u002Fspan>\n            <span style=\"position:absolute;right:10px;top:10px;background:#C8471F;color:#FFFFFF;border-radius:8px;padding:3px 8px;font-size:12px;font-weight:800\">мозаика<\u002Fspan>\n          <\u002Fdiv>\n          <input type=\"range\" min=\"0\" max=\"100\" step=\"1\" value=\"{{ cmp }}\" sc-camel-on-change=\"{{ onCmp }}\" aria-label=\"Сравнение\" style=\"width:min(100%,380px)\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"gift\" style=\"max-width:1240px;margin:0 auto;padding:80px 24px;display:flex;flex-direction:column;gap:32px\">\n      <div style=\"display:flex;flex-direction:column;gap:10px;max-width:720px\"><h2 style=\"margin:0;font-family:'Montserrat Alternates',sans-serif;font-weight:800;font-size:clamp(30px,3.8vw,48px);letter-spacing:-.02em;line-height:1.05\">Не знаешь, что подарить?<\u002Fh2><p style=\"margin:0;color:#4F6563;font-size:17px\">Картина из общего фото — подарок, который собирают своими руками.<\u002Fp><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px\">\n        <div style=\"background:#F6D5BF;border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:10px;min-height:200px\"><strong style=\"font-family:'Montserrat Alternates',sans-serif;font-weight:800;font-size:22px\">Любое изображение<\u002Fstrong><span>Портрет, питомец, пейзаж — генератор подберёт тона под палитру набора.<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#D3E8E0;border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:10px;min-height:200px\"><strong style=\"font-family:'Montserrat Alternates',sans-serif;font-weight:800;font-size:22px\">1 набор — ∞ фото<\u002Fstrong><span>Детали те же, меняется только схема. Разбери и собери новую картину.<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#FFFFFF;border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:10px;min-height:200px\"><strong style=\"font-family:'Montserrat Alternates',sans-serif;font-weight:800;font-size:22px\">Вместе веселее<\u002Fstrong><span>Блоки 8×8 удобно делить: каждый собирает свой кусок картины.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"faq\" style=\"background:#FFFFFF;border-top:1px solid #E2D9CC;border-bottom:1px solid #E2D9CC\">\n      <div style=\"max-width:880px;margin:0 auto;padding:80px 24px;display:flex;flex-direction:column;gap:24px\">\n        <h2 style=\"margin:0;font-family:'Montserrat Alternates',sans-serif;font-weight:800;font-size:clamp(30px,3.8vw,48px);letter-spacing:-.02em;line-height:1.05\">Вопросы<\u002Fh2>\n        <div style=\"display:flex;flex-direction:column;border-top:1px solid #E2D9CC\">\n          <sc-for list=\"{{ faq }}\" as=\"f\" hint-placeholder-count=\"4\">\n            <div style=\"border-bottom:1px solid #E2D9CC\">\n              <button sc-camel-on-click=\"{{ f.onToggle }}\" style=\"width:100%;display:flex;justify-content:space-between;gap:16px;align-items:center;background:none;border:0;padding:20px 0;font:inherit;font-weight:800;font-size:18px;color:#14302F;text-align:left;cursor:pointer\">{{ f.q }}<span style=\"flex:none;width:32px;height:32px;border-radius:10px;background:#F6F1EA;display:flex;align-items:center;justify-content:center;color:#C8471F;font-size:20px\">{{ f.sign }}<\u002Fspan><\u002Fbutton>\n              <sc-if value=\"{{ f.open }}\"><p style=\"margin:0 0 20px;color:#4F6563;max-width:680px\">{{ f.a }}<\u002Fp><\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"max-width:1240px;margin:0 auto;padding:80px 24px\">\n      <div style=\"background:#C8471F;color:#FFFFFF;border-radius:28px;padding:44px 32px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap\">\n        <div style=\"display:flex;flex-direction:column;gap:8px;max-width:520px\"><h2 style=\"margin:0;font-family:'Montserrat Alternates',sans-serif;font-weight:800;font-size:clamp(26px,3vw,38px);line-height:1.1\">Уже купил набор?<\u002Fh2><span>Введи код из коробки, загрузи фото и скачай инструкцию.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:10px;flex-wrap:wrap;flex:1 1 320px;max-width:460px\">\n          <input value=\"{{ code }}\" sc-camel-on-change=\"{{ onCode }}\" placeholder=\"Код из коробки\" style=\"flex:1 1 180px;min-width:0;border:0;border-radius:12px;padding:14px 16px;font:inherit;font-weight:700;color:#14302F;background:#FFFFFF\">\n          <button sc-camel-on-click=\"{{ onCodeGo }}\" style=\"background:#14302F;color:#F6F1EA;border:0;border-radius:12px;padding:14px 22px;font:inherit;font-weight:800;cursor:pointer\">Дальше →<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <footer style=\"border-top:1px solid #E2D9CC\"><div style=\"max-width:1240px;margin:0 auto;padding:24px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:#4F6563;font-size:14px\"><span style=\"font-family:'Montserrat Alternates',sans-serif;font-weight:800;color:#14302F\">kubix<\u002Fspan><span>© 2026<\u002Fspan><\u002Fdiv><\u002Ffooter>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isApp }}\" hint-placeholder-val=\"{{ false }}\">\n    <main style=\"max-width:1240px;margin:0 auto;padding:24px 24px 130px;display:flex;flex-direction:column;gap:28px\">\n      <ol style=\"list-style:none;margin:0;padding:6px;display:flex;gap:6px;overflow-x:auto;background:#FFFFFF;border-radius:16px\">\n        <sc-for list=\"{{ steps }}\" as=\"st\" hint-placeholder-count=\"5\">\n          <li style=\"flex:1 0 auto\"><button sc-camel-on-click=\"{{ st.onClick }}\" style=\"width:100%;display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;background:{{ st.bg }};color:{{ st.ink }};border:0;border-radius:11px;padding:10px 14px;font:inherit;font-weight:800;font-size:14px;cursor:pointer\"><span style=\"font-family:'Montserrat Alternates',sans-serif\">{{ st.n }}<\u002Fspan>{{ st.label }}<\u002Fbutton><\u002Fli>\n        <\u002Fsc-for>\n      <\u002Fol>\n      <div style=\"display:flex;flex-direction:column;gap:8px;max-width:760px\">\n        <h1 style=\"margin:0;font-family:'Montserrat Alternates',sans-serif;font-weight:800;font-size:clamp(30px,4.2vw,52px);letter-spacing:-.02em;line-height:1.05\">{{ stepTitle }}<\u002Fh1>\n        <p style=\"margin:0;color:#4F6563;font-size:17px;text-wrap:pretty\">{{ stepSub }}<\u002Fp>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ isStep1 }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:14px\">\n          <sc-for list=\"{{ shop }}\" as=\"q\" hint-placeholder-count=\"5\">\n            <button sc-camel-on-click=\"{{ q.onPick }}\" style=\"text-align:left;background:#FFFFFF;border:0;box-shadow:inset 0 0 0 2px {{ q.bd }};border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:10px;font:inherit;color:#14302F;cursor:pointer\">\n              <div style=\"background:#14302F;border-radius:12px;padding:8px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;width:100%\"><sc-if value=\"{{ ready }}\"><div style=\"height:100%;max-width:100%;aspect-ratio:{{ q.aspect }};border-radius:3px;background-image:url({{ q.preview }});background-size:100% 100%\"><\u002Fdiv><\u002Fsc-if><\u002Fdiv>\n              <span style=\"display:flex;justify-content:space-between;align-items:baseline;padding:0 4px\"><span style=\"font-family:'Montserrat Alternates',sans-serif;font-weight:800;font-size:19px\">{{ q.name }}<\u002Fspan><span style=\"font-size:13px;color:#4F6563\">{{ q.size }}<\u002Fspan><\u002Fspan>\n              <span style=\"padding:0 4px 4px;font-size:13px;color:#4F6563\">{{ q.colors }} · {{ q.pieces }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isStep2 }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:stretch\">\n          <label sc-camel-on-drag-over=\"{{ onDragOver }}\" sc-camel-on-drag-leave=\"{{ onDragLeave }}\" sc-camel-on-drop=\"{{ onDrop }}\" style=\"flex:2 1 420px;min-height:340px;border:2px dashed {{ dropBd }};border-radius:24px;background:{{ dropBg }};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:40px 24px;text-align:center;cursor:pointer\">\n            <input type=\"file\" accept=\"image/jpeg,image/png,image/webp\" sc-camel-on-change=\"{{ onFile }}\" style=\"display:none\">\n            <span style=\"font-family:'Montserrat Alternates',sans-serif;font-weight:800;font-size:26px\">Перетащи фото сюда<\u002Fspan>\n            <span style=\"color:#4F6563\">JPG, PNG или WEBP<\u002Fspan>\n            <span style=\"background:#C8471F;color:#FFFFFF;border-radius:12px;padding:12px 22px;font-weight:800\">Выбрать файл<\u002Fspan>\n          <\u002Flabel>\n          <div style=\"flex:1 1 260px;background:#FFFFFF;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:12px\">\n            <span style=\"font-size:14px;font-weight:800;color:#4F6563\">Сейчас загружено<\u002Fspan>\n            <sc-if value=\"{{ ready }}\"><div role=\"img\" style=\"width:100%;height:240px;border-radius:14px;background-color:#F6F1EA;background-image:url({{ srcUrl }});background-size:contain;background-position:center;background-repeat:no-repeat\"><\u002Fdiv><\u002Fsc-if>\n            <span style=\"font-size:14px;overflow:hidden;text-overflow:ellipsis\">{{ photoName }}<\u002Fspan>\n            <button sc-camel-on-click=\"{{ useSample }}\" style=\"background:#14302F;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:800;color:#F6F1EA;cursor:pointer\">Продолжить с этим фото<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isStep3 }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:24px;align-items:start\">\n          <div style=\"display:flex;flex-direction:column;gap:14px\">\n            <div sc-camel-on-pointer-down=\"{{ onDown }}\" sc-camel-on-pointer-move=\"{{ onMove }}\" sc-camel-on-pointer-up=\"{{ onUp }}\" sc-camel-on-pointer-cancel=\"{{ onUp }}\" style=\"position:relative;overflow:hidden;aspect-ratio:{{ srcAspect }};width:100%;border-radius:20px;background:#E2D9CC;cursor:grab;touch-action:none;user-select:none\">\n              <sc-if value=\"{{ ready }}\"><div style=\"position:absolute;inset:0;background-image:url({{ srcUrl }});background-size:100% 100%;pointer-events:none\"><\u002Fdiv><\u002Fsc-if>\n              <div style=\"position:absolute;left:{{ frameL }};top:{{ frameT }};width:{{ frameW }};height:{{ frameH }};border:3px solid #C8471F;border-radius:6px;box-shadow:0 0 0 9999px rgba(20,48,47,.6);pointer-events:none\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:14px;background:#FFFFFF;border-radius:14px;padding:10px 16px\"><span style=\"font-size:14px;font-weight:800\">Масштаб<\u002Fspan><input type=\"range\" min=\"1\" max=\"3\" step=\"0.05\" value=\"{{ zoom }}\" sc-camel-on-change=\"{{ onZoom }}\" style=\"flex:1\"><span style=\"font-size:14px;font-weight:800;width:48px;text-align:right\">{{ zoomLabel }}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#14302F;border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px\">\n            <sc-if value=\"{{ ready }}\"><div role=\"img\" aria-label=\"Превью\" style=\"width:100%;aspect-ratio:{{ aspect }};border-radius:8px;background-image:url({{ curUrl }});background-size:100% 100%\"><\u002Fdiv><\u002Fsc-if>\n            <span style=\"color:#C9D6D3;font-size:14px;padding:0 4px\">Превью · <b style=\"color:#F6F1EA\">{{ curName }}<\u002Fb> · {{ sumSet }} · {{ sumSize }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isStep4 }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px\">\n          <sc-for list=\"{{ variants }}\" as=\"v\" hint-placeholder-count=\"4\">\n            <article style=\"background:#FFFFFF;box-shadow:inset 0 0 0 2px {{ v.bd }};border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:10px\">\n              <button sc-camel-on-click=\"{{ v.onPick }}\" style=\"padding:8px;border:0;background:#14302F;border-radius:14px;cursor:pointer;display:block\"><div style=\"width:100%;aspect-ratio:{{ aspect }};border-radius:4px;background-image:url({{ v.url }});background-size:100% 100%\"><\u002Fdiv><\u002Fbutton>\n              <div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 4px\"><span style=\"font-weight:800;font-size:18px\">{{ v.name }}<\u002Fspan><span style=\"background:#F6F1EA;border-radius:8px;padding:2px 8px;font-weight:800;font-size:14px\">{{ v.score }}<\u002Fspan><\u002Fdiv>\n              <sc-if value=\"{{ v.best }}\"><span style=\"align-self:flex-start;margin-left:4px;background:#D3E8E0;font-size:12px;font-weight:800;padding:2px 10px;border-radius:8px\">лучшая оценка<\u002Fspan><\u002Fsc-if>\n              <p style=\"margin:0;padding:0 4px;font-size:14px;color:#4F6563;text-wrap:pretty\">{{ v.desc }}<\u002Fp>\n              <button sc-camel-on-click=\"{{ v.onPick }}\" style=\"margin-top:auto;background:{{ v.btnBg }};color:{{ v.btnInk }};border:0;box-shadow:inset 0 0 0 1.5px #E2D9CC;border-radius:12px;padding:10px 14px;font:inherit;font-weight:800;font-size:14px;cursor:pointer\">{{ v.btn }}<\u002Fbutton>\n            <\u002Farticle>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isStep5 }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:16px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:#FFFFFF;border-radius:18px;padding:12px 18px\">\n            <span style=\"font-size:14px;color:#4F6563\"><b style=\"color:#14302F\">{{ sumSet }}<\u002Fb> · {{ sumSize }} · {{ curName }} · {{ sumCells }} деталей<\u002Fspan>\n            <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap\"><div style=\"display:flex;background:#F6F1EA;border-radius:12px;padding:3px\"><sc-for list=\"{{ blockSizes }}\" as=\"b\" hint-placeholder-count=\"3\"><button sc-camel-on-click=\"{{ b.onClick }}\" style=\"background:{{ b.bg }};color:{{ b.ink }};border:0;border-radius:9px;padding:6px 12px;font:inherit;font-weight:800;font-size:13px;cursor:pointer\">{{ b.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><button sc-camel-on-click=\"{{ onPdf }}\" style=\"background:#C8471F;border:0;border-radius:12px;color:#FFFFFF;padding:9px 16px;font:inherit;font-weight:800;font-size:14px;cursor:pointer\">Скачать PDF<\u002Fbutton><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start\">\n            <div style=\"flex:2 1 440px;background:#FFFFFF;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap\">\n                <div><div style=\"font-family:'Montserrat Alternates',sans-serif;font-weight:800;font-size:24px\">{{ blockStep }}<\u002Fdiv><div style=\"font-size:14px;color:#4F6563\">{{ blockId }} · {{ blockPos }}<\u002Fdiv><\u002Fdiv>\n                <div style=\"display:flex;gap:8px\"><button sc-camel-on-click=\"{{ onPrev }}\" style=\"opacity:{{ prevOp }};background:#F6F1EA;border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:800;cursor:pointer\">←<\u002Fbutton><button sc-camel-on-click=\"{{ onNext5 }}\" style=\"opacity:{{ nextOp }};background:#14302F;border:0;border-radius:12px;padding:11px 18px;font:inherit;font-weight:800;color:#F6F1EA;cursor:pointer\">Следующий блок →<\u002Fbutton><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"height:8px;border-radius:8px;background:#F6F1EA;overflow:hidden\"><div style=\"height:100%;width:{{ progress }};background:#C8471F\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:{{ blockCols }};gap:3px;background:#14302F;padding:6px;border-radius:10px;max-width:640px\">\n                <sc-for list=\"{{ blockCells }}\" as=\"c\" hint-placeholder-count=\"64\"><div style=\"aspect-ratio:1;border-radius:3px;background:{{ c.hex }};color:{{ c.ink }};display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(9px,1.6vw,15px)\">{{ c.num }}<\u002Fdiv><\u002Fsc-for>\n              <\u002Fdiv>\n              <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px\"><sc-for list=\"{{ blockCounts }}\" as=\"c\"><li style=\"display:flex;align-items:center;gap:8px;font-size:14px;background:#F6F1EA;border-radius:10px;padding:5px 10px 5px 5px\"><span style=\"width:20px;height:20px;border-radius:5px;background:{{ c.hex }};box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)\"><\u002Fspan><b>{{ c.num }}<\u002Fb><span>{{ c.name }}<\u002Fspan><b style=\"color:#C8471F\">×{{ c.count }}<\u002Fb><\u002Fli><\u002Fsc-for><\u002Ful>\n            <\u002Fdiv>\n            <aside style=\"flex:1 1 240px;display:flex;flex-direction:column;gap:16px\">\n              <div style=\"background:#14302F;border-radius:20px;padding:10px\"><div style=\"position:relative;overflow:hidden;border-radius:6px\"><sc-if value=\"{{ ready }}\"><div style=\"width:100%;aspect-ratio:{{ aspect }};background-image:url({{ curUrl }});background-size:100% 100%\"><\u002Fdiv><\u002Fsc-if><div style=\"position:absolute;left:{{ hlL }};top:{{ hlT }};width:{{ hlW }};height:{{ hlH }};border:3px solid #C8471F;box-shadow:0 0 0 9999px rgba(20,48,47,.55)\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n              <ul style=\"list-style:none;margin:0;padding:14px 18px;display:flex;flex-direction:column;gap:2px;background:#FFFFFF;border-radius:20px\"><sc-for list=\"{{ legend }}\" as=\"l\" hint-placeholder-count=\"5\"><li style=\"display:flex;align-items:center;gap:10px;font-size:14px;padding:5px 0\"><b style=\"width:16px;color:#4F6563\">{{ l.num }}<\u002Fb><span style=\"width:16px;height:16px;border-radius:4px;background:{{ l.hex }};box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)\"><\u002Fspan><span>{{ l.name }}<\u002Fspan><span style=\"margin-left:auto;color:#4F6563\">{{ l.total }}<\u002Fspan><\u002Fli><\u002Fsc-for><\u002Ful>\n            <\u002Faside>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fmain>\n    <div style=\"position:sticky;bottom:0;z-index:15;background:rgba(246,241,234,.94);backdrop-filter:blur(10px);border-top:1px solid #E2D9CC\">\n      <div style=\"max-width:1240px;margin:0 auto;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px\">\n        <sc-if value=\"{{ hasBack }}\"><button sc-camel-on-click=\"{{ onBack }}\" style=\"background:#FFFFFF;border:0;border-radius:12px;padding:12px 20px;font:inherit;font-weight:800;color:#14302F;cursor:pointer;box-shadow:inset 0 0 0 1px #E2D9CC\">← Назад<\u002Fbutton><\u002Fsc-if>\n        <span style=\"flex:1\"><\u002Fspan>\n        <sc-if value=\"{{ hasNext }}\"><button sc-camel-on-click=\"{{ onNext }}\" style=\"background:#C8471F;border:0;border-radius:12px;padding:13px 24px;font:inherit;font-weight:800;color:#FFFFFF;cursor:pointer\">{{ nextLabel }} →<\u002Fbutton><\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ hasToast }}\"><div style=\"position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:40;background:#14302F;color:#F6F1EA;border-radius:14px;padding:12px 20px;font-size:14px;font-weight:700;max-width:min(90vw,520px);text-align:center\">{{ toast }}<\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { screen: 'landing', step: 1, presetId: 'color-m', crop: { z: 1, x: 0.5, y: 0.42 }, variantId: 'G', blockSize: 8, block: -1, v: 0, photoName: 'пример фото', drag: false, toast: '', cart: 0, faq: 0, cmp: 50, code: '' };\n  wantPreviews = true;\n  T = {\n    selBd: '#C8471F', bd: 'transparent', selBg: '#FFFFFF', bg: '#FFFFFF', dashed: '#C9BBA6',\n    on: '#14302F', onInk: '#F6F1EA', offInk: '#14302F',\n    step: { on: { bg: '#C8471F', ink: '#FFFFFF', bd: '' }, done: { bg: '#D3E8E0', ink: '#14302F', bd: '' }, todo: { bg: 'transparent', ink: '#4F6563', bd: '' } },\n  };\n  R = { gap: 0.1, base: '#14302F', shape: 'square', bevel: true };\n  FAQ = [\n    ['Почему деталей в коробке больше, чем клеток?', 'Запаса примерно в полтора раза больше: любая фотография где-то перекошена в один цвет, и без запаса картину было бы не собрать.'],\n    ['Какое фото подойдёт лучше всего?', 'Портрет при дневном свете, лицо крупно. Мелкие детали на дальнем плане в сетке 64×64 почти не читаются.'],\n    ['Можно пересобрать с другим фото?', 'Да. Детали те же, меняется только схема: загрузи новое фото и получи новую инструкцию.'],\n    ['Фото куда-то отправляется?', 'Нет, превью и схема считаются прямо в браузере.'],\n  ];\n  componentDidMount() {\n    const w = () => { if (window.Kubix) { this.K = window.Kubix; this.K.init(this); this.forceUpdate(); } else setTimeout(w, 30); };\n    w();\n  }\n  renderVals() {\n    if (!this.K) return { ready: false, isLanding: true, isApp: false, cartCount: 0, cartBg: '#B9B0A3' };\n    const v = this.K.vals(this), s = this.state;\n    const all = [...v.presetsClassic, ...v.presetsColor];\n    return {\n      ...v,\n      cartCount: s.cart, cartBg: s.cart ? '#C8471F' : '#B9B0A3',\n      shop: all.map((q) => ({ ...q, onBuy: () => { this.setState((st) => ({ cart: st.cart + 1 })); this.K.toast(this, q.name + ' добавлен в корзину'); } })),\n      faq: this.FAQ.map(([q, a], i) => ({ q, a, open: s.faq === i, sign: s.faq === i ? '−' : '+', onToggle: () => this.setState({ faq: s.faq === i ? -1 : i }) })),\n      cmp: s.cmp, cmpPos: s.cmp + '%', cmpClip: (100 - s.cmp) + '%', onCmp: (e) => this.setState({ cmp: +e.target.value }),\n      onLandFile: (e) => { const f = e.target.files && e.target.files[0]; if (f) { this.K.load(f).then((c) => { this._src = c; this.setState((st) => ({ v: st.v + 1, photoName: f.name })); }); } e.target.value = ''; },\n      onDrop: (e) => { e.preventDefault(); this.setState({ drag: false }); const f = e.dataTransfer && e.dataTransfer.files[0]; if (!f) return; if (s.screen === 'landing') this.K.load(f).then((c) => { this._src = c; this.setState((st) => ({ v: st.v + 1, photoName: f.name })); }); else v.onDrop(e); },\n      code: s.code, onCode: (e) => this.setState({ code: e.target.value }),\n      onCodeGo: () => { if (!s.code.trim()) { this.K.toast(this, 'Введи код с карточки внутри коробки'); return; } this.setState({ screen: 'app', step: 2 }); window.scrollTo({ top: 0 }); },\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
